# One-click deploy on Render (free tier): https://render.com/deploy?repo=https://github.com/vsdahiya1986-wq/nerisal-zero
services:
  - type: web
    name: nerisal-zero
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
